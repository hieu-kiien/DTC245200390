name: FleetOps Docker integration smoke (Linux)
on:
  pull_request:
  workflow_dispatch:
jobs:
  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary local credentials and HTTPS certificate
        run: |
          ./scripts/gen-env.sh
          ./scripts/gen-cert.sh
      - name: Start Docker Compose stack
        run: docker compose up -d --build
      - name: Verify runtime Node dependencies
        run: docker compose exec -T webapp node -e "require('express'); require('pg'); require('prom-client')"
      - name: Validate Nginx configuration
        run: docker compose exec -T nginx nginx -t
      - name: Wait for webapp and PostgreSQL
        run: |
          for i in $(seq 1 60); do
            if curl -ksf https://localhost/health > /dev/null; then echo 'health endpoint OK'; exit 0; fi
            sleep 5
          done
          echo 'FleetOps webapp did not become healthy' >&2
          exit 1
      - name: CRUD/login smoke test
        run: ./tests/smoke_api.sh
      - name: Verify Loki log ingestion and Grafana brute-force webhook
        run: ./tests/check_logql.sh
      - name: Stop stack
        if: always()
        run: docker compose down
